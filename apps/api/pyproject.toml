[project]
name = "photogrid-api"
version = "0.1.0"
description = "Photogrid FastAPI backend — multi-tenant photographer SaaS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Photogrid" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.1",
  "firebase-admin>=6.5.0",
  "python-multipart>=0.0.20",
  "httpx>=0.27.2",
  "python-slugify>=8.0.4",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7.4",
  "mypy>=1.13.0",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "types-python-slugify>=8.0.2.20240310",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "N", "ASYNC", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
